# =============================================================
# Swift-Fruit-Slice AI 切水果 —— 全局配置文件
# 修改后保存并重启游戏生效（打包版改 exe 同目录下的 settings.yaml）
# =============================================================

camera:
  index: 1          # 摄像头编号：0=内置/默认，1=第一个外接摄像头，2=第二个…
  width: 1280       # 采集宽度（分辨率越高越清晰，但帧率可能下降）
  height: 720       # 采集高度
  fps: 60           # 请求帧率；实际以驱动为准，启动日志会打印真实值
  mirror: true      # 画面镜像：true 像照镜子（推荐），false 为原始方向

game:
  window_width: 1280        # 游戏窗口宽度
  window_height: 720        # 游戏窗口高度
  spawn_interval: 12        # 水果初始生成间隔（帧），越小越密集
  min_spawn_interval: 4     # 难度提升后允许的最小生成间隔（帧）
  max_on_screen: 12         # 屏幕上初始最多同时存在的物体数
  max_on_screen_cap: 25     # 难度提升后物体数上限
  difficulty_step_time: 10  # 每隔多少秒提升一次难度
  total_time: 30            # 双人 PK 模式总时长（秒）
  fruit_theme: "default"    # 水果主题：default=普通水果；ads=广告图标

ai:
  max_hands: 6         # 最多同时识别几只手（越大越吃性能）
  delegate: "auto"     # 推理设备：auto=优先 GPU，失败自动退回 CPU；cpu=强制 CPU
  infer_width: 320     # 推理输入宽度（越小越快，越大略准）
  infer_height: 240    # 推理输入高度

paths:
  assets_dir: "assets"                # 素材根目录（相对 exe 所在目录）
  models_dir: "models"                # 模型根目录
  model_name: "hand_landmarker.task"  # 手势识别模型文件名
  bgm_name: "1.mp3"                   # 背景音乐文件名

# 仅在 game.fruit_theme 改为 "ads" 时生效：把水果换成广告图标
ads:
  scale: 0.49        # 全部广告图标的统一缩放比例
  custom_scales:     # 单独调整某张图，没写的仍用上面的 scale
    shouji: 0.23
    shoubiao: 0.30
    crw: 0.30
    bing: 0.23
    lachang: 0.30
